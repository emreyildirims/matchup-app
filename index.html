<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F0D" />
  <meta name="description" content="MatchUp — Türkiye'nin Halı Saha Platformu. Takım kur, oyuncu bul, kaleci kirala." />
  <title>MatchUp — Türkiye'nin Halı Saha Platformu</title>

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/features.css" />
  <link rel="stylesheet" href="styles/animations.css" />

  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 8 14v18c0 15 10.5 24.5 24 28 13.5-3.5 24-13 24-28V14L32 4z' fill='%232ECC71'/%3E%3Ccircle cx='32' cy='30' r='10' fill='%230B0F0D'/%3E%3C/svg%3E" />
</head>
<body>

  <div id="splash" class="splash">
    <div class="splash__logo" id="splash-logo"></div>
    <h1 class="splash__title">Match<span>Up</span></h1>
    <p class="splash__slogan">Türkiye'nin Halı Saha Platformu</p>
    <div class="splash__loader"><span></span></div>
  </div>

  <div id="app" class="app" hidden>

    <header id="header" class="header">
      <div class="header__row">
        <button class="header__brand" data-action="go" data-route="home" aria-label="Ana Sayfa">
          <span class="header__logo" id="header-logo"></span>
          <span class="header__name">Match<b>Up</b></span>
        </button>
        <div class="header__actions">
          <button class="icon-btn" data-action="go" data-route="chat" aria-label="Mesajlar">
            <span id="chat-icon"></span>
          </button>
          <button class="icon-btn header__bell" data-action="go" data-route="notifications" aria-label="Bildirimler">
            <span id="bell-icon"></span>
            <span class="badge-dot" id="bell-badge"></span>
          </button>
        </div>
      </div>
      <div class="search-bar">
        <span class="search-bar__icon" id="search-icon"></span>
        <input id="global-search" type="search" placeholder="Takım, oyuncu, kaleci veya maç ara..."
               autocomplete="off" aria-label="Global arama" />
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Ana navigasyon"></nav>
  </div>

  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script defer src="data/data.js"></script>
  <script defer src="utils/storage.js"></script>
  <script defer src="utils/icons.js"></script>
  <script defer src="utils/helpers.js"></script>
  <script defer src="components/toast.js"></script>
  <script defer src="components/modal.js"></script>
  <script defer src="pages/home.js"></script>
  <script defer src="pages/matches.js"></script>
  <script defer src="pages/teams.js"></script>
  <script defer src="pages/goalkeepers.js"></script>
  <script defer src="pages/players.js"></script>
  <script defer src="pages/profile.js"></script>
  <script defer src="pages/detail.js"></script>
  <script defer src="pages/leaderboard.js"></script>
  <script defer src="pages/chat.js"></script>
  <script defer src="pages/venues.js"></script>
  <script defer src="pages/favorites.js"></script>
  <script defer src="pages/misc.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
